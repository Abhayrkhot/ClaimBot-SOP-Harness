[project]
name = "claimbot"
version = "2.0.0"
description = "SOP-governed LLM agent runtime: the model interprets and phrases, a deterministic policy engine authorizes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abhay Khot" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openai>=1.50",
  "anthropic>=0.70",
  "aiosqlite>=0.20",
  "psycopg[binary,pool]>=3.2",
  "aiosmtplib>=3.0",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
eval = ["numpy>=2.0", "scipy>=1.14", "tabulate>=0.9", "matplotlib>=3.9"]

[project.scripts]
claimbot = "claimbot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimbot"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "PERF", "C4"]
ignore = [
  "S101",   # asserts are fine in tests and for internal invariants
  "S311",   # random is used for seeded simulation, not cryptography
  "ASYNC109",  # provider adapters forward an explicit per-call timeout to the vendor SDK
  "RUF001", "RUF002", "RUF003",  # curly quotes appear in customer-facing text
]

[tool.ruff.lint.pycodestyle]
max-line-length = 125  # the formatter wraps code at 110; long user-facing strings may run a little over

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT006", "PT018"]
"scripts/**" = ["PERF401", "RUF005"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/claimbot"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aiosmtplib.*", "psycopg_pool.*", "scipy.*", "tabulate.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: needs DATABASE_URL pointing at a disposable PostgreSQL database",
]
addopts = "-q"

[tool.coverage.run]
source = ["claimbot"]
branch = true
omit = ["src/claimbot/eval/*", "src/claimbot/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
