# Local single-service deployment. The host port and model provider are selected
# through environment variables; session data survives restarts in a named volume.
services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      # Set one key. Without one the agent runs in its deterministic rules fallback.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TURN_BUDGET_SECONDS: ${LLM_TURN_BUDGET_SECONDS:-45}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    volumes:
      - sessions:/data
volumes:
  sessions:
