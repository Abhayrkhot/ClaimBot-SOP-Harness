<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimBot SOP Harness</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#16203a;--muted:#64708a;--line:#e3e8f0;--accent:#2f5bea;--accent-ink:#fff;
--ok:#137a4b;--ok-bg:#e6f5ee;--bad:#b4232c;--bad-bg:#fdecec;--warn:#8a5a00;--warn-bg:#fff4dc;--user:#2f5bea;--bot:#eef1f7;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--panel:#171c2c;--ink:#e6e9f2;--muted:#9aa3b8;--line:#283048;--accent:#6c8cff;
--ok:#5fd39b;--ok-bg:#16302a;--bad:#ff8a8f;--bad-bg:#3a1c21;--warn:#ffcf70;--warn-bg:#352a14;--user:#4a6cf0;--bot:#222a40}}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}header .sub{color:var(--muted);font-size:13px}
header .spacer{flex:1}button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
padding:7px 12px;border-radius:8px;cursor:pointer}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1240px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
#chatcard{display:flex;flex-direction:column;height:calc(100vh - 100px);min-height:480px}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;line-height:1.45;white-space:pre-wrap;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.meta{font-size:11.5px;color:var(--muted);align-self:flex-start;margin-top:-4px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
aside{display:flex;flex-direction:column;gap:12px}
aside .card{padding:14px}aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.steps{display:flex;flex-direction:column;gap:6px}.step{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}.step.done{color:var(--ink)}.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.now{color:var(--ink);font-weight:600}.step.now .dot{background:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin:2px 4px 2px 0}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.empty{color:var(--muted);font-size:13px}pre{white-space:pre-wrap;font-size:12.5px;margin:0;font-family:ui-monospace,Menlo,monospace}
.banner{padding:10px 12px;border-radius:8px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>ClaimBot</h1><span class="sub">SOP-governed claims assistant · synthetic data · email goes to a local test inbox</span>
  <span class="spacer"></span><span id="mode" class="tag warn">connecting</span>
  <button id="end">End chat</button><button id="new" class="primary">New chat</button>
</header>
<main>
  <section class="card" id="chatcard">
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form"><textarea id="text" rows="1" maxlength="4000" placeholder="Ask about your claim..." aria-label="Message"></textarea>
    <button class="primary" id="send" type="submit">Send</button></form>
  </section>
  <aside>
    <div class="card"><h2>SOP phase</h2><div class="steps" id="steps"></div><div id="terminal" style="margin-top:8px"></div></div>
    <div class="card"><h2>Session</h2><dl class="kv" id="kv"></dl></div>
    <div class="card"><h2>Policy decisions this turn</h2><div id="policy" class="empty">Nothing yet.</div></div>
    <div class="card" id="emailcard" hidden><h2>Summary email</h2><pre id="email"></pre></div>
  </aside>
</main>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const PHASES = [["VERIFY_ID","Verify identity"],["RESOLVE_INTENT","Find the claim"],["PROCESS_CASE","Answer from approved facts"],["POST_PROCESS","Offer summary email"],["COMPLETE","Complete"]];
  const TERMINAL = {HANDOFF:"Handed to a human", LOCKED:"Locked: verification failed", CLOSED:"Chat ended"};
  const GREETING = "Hi, I'm ClaimBot. I can help with questions about your insurance claims.\n\nTo protect your information I'll first verify your identity. Please share any three of: full name, date of birth, phone number, email address, or the last four digits of your SSN or member ID.\n\nTry the synthetic customer Margaret Chen, born 1985-03-15, SSN last four 4472.";
  let sid = null, busy = false;

  function bubble(text, who, meta) {
    const el = document.createElement("div"); el.className = "msg " + who; el.textContent = text; $("#log").append(el);
    if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; $("#log").append(m); }
    $("#log").scrollTop = $("#log").scrollHeight;
  }
  function tag(text, kind) { const t = document.createElement("span"); t.className = "tag " + kind; t.textContent = text; return t; }
  function renderSteps(phase) {
    const idx = PHASES.findIndex(([p]) => p === phase);
    $("#steps").replaceChildren(...PHASES.map(([p, label], i) => {
      const d = document.createElement("div"); d.className = "step" + (i < idx || phase === "COMPLETE" ? " done" : "") + (i === idx && phase !== "COMPLETE" ? " now" : "");
      d.innerHTML = '<span class="dot"></span>'; d.append(label); return d;
    }));
    $("#terminal").replaceChildren(...(TERMINAL[phase] ? [tag(TERMINAL[phase], "warn")] : []));
  }
  function kv(rows) {
    $("#kv").replaceChildren(...rows.flatMap(([k, v]) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd");
      if (v instanceof Node) dd.append(v); else dd.textContent = v; return [dt, dd]; }));
  }
  function renderState(r) {
    renderSteps(r.phase);
    kv([["Identity", r.verified ? tag("verified", "ok") : tag(`${r.captured_fields.length} of 3 details`, "warn")],
        ["Claim", r.case_id || "none selected"], ["Awaiting", r.awaiting || "nothing"],
        ["Interpreter", r.response_mode], ["Reply", r.render_mode], ["Latency", `${r.latency_ms} ms · ${r.llm_calls} model call(s)`]]);
    const p = r.policy, box = $("#policy"); box.className = ""; box.replaceChildren();
    p.transitions.forEach((t) => box.append(tag(t.replace("->", " → "), "warn")));
    p.disclosed.forEach((f) => box.append(tag("disclosed " + f, "ok")));
    p.blocked.forEach((b) => box.append(tag(`blocked ${b.fact}: ${b.reason}`, "bad")));
    if (!box.childNodes.length) { box.className = "empty"; box.textContent = "No claim data disclosed this turn."; }
    if (r.email_preview) { $("#emailcard").hidden = false; $("#email").textContent = `To: ${r.email_preview.to}\nSubject: ${r.email_preview.subject}\nStatus: ${r.email_preview.status}\n\n${r.email_preview.body}`; }
  }
  function setBusy(v) { busy = v; $("#send").disabled = v; $("#text").disabled = v; }
  function fresh() {
    sid = null; $("#log").replaceChildren(); $("#emailcard").hidden = true; bubble(GREETING, "bot");
    renderSteps("VERIFY_ID"); kv([["Identity", tag("0 of 3 details", "warn")], ["Claim", "none selected"]]);
    const box = $("#policy"); box.className = "empty"; box.textContent = "Nothing yet."; $("#text").focus();
  }
  async function send(message, attempt = 0, requestId = crypto.randomUUID()) {
    const res = await fetch("/v1/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sid, message, request_id: requestId})});
    if (res.status === 409 && attempt < 2) { await new Promise((r) => setTimeout(r, 300)); return send(message, attempt + 1, requestId); }
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.statusText); }
    return res.json();
  }
  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault(); const message = $("#text").value.trim(); if (!message || busy) return;
    bubble(message, "user"); $("#text").value = ""; setBusy(true);
    try { const r = await send(message); sid = r.session_id; bubble(r.reply, "bot", `${r.phase} · ${r.render_mode}`); renderState(r); }
    catch (err) { bubble("Sorry, something went wrong: " + err.message, "bot"); }
    finally { setBusy(false); $("#text").focus(); }
  });
  $("#text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
  $("#new").onclick = fresh;
  $("#end").onclick = async () => { if (!sid) return fresh(); await fetch(`/v1/sessions/${sid}/end`, {method: "POST"}); bubble("Chat ended.", "bot"); renderSteps("CLOSED"); };
  fetch("/api/health").then((r) => r.json()).then((h) => { const m = $("#mode"); m.className = "tag " + (h.mode === "model" ? "ok" : "warn");
    m.textContent = h.mode === "model" ? `model mode · ${h.response_mode} replies` : "rules mode (no model configured)"; }).catch(() => { $("#mode").textContent = "offline"; });
  fresh();
})();
</script>
</body>
</html>
