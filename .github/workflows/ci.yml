name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: claimbot
          POSTGRES_PASSWORD: claimbot
          POSTGRES_DB: claimbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimbot" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://claimbot:claimbot@localhost:5432/claimbot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: README results match results/
        run: uv run python scripts/gen_readme.py --check
      - name: Tests (SQLite and PostgreSQL), coverage gate
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90
      - name: Adversarial property tests (extended)
        run: uv run pytest -q tests/test_adversarial_properties.py
        env:
          CLAIMBOT_PROPERTY_EXAMPLES: "1500"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t claimbot:ci .
      - name: Smoke test
        run: |
          docker run -d --name cb -p 8000:8000 -e ADMIN_API_TOKEN=ci claimbot:ci
          for i in $(seq 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/readyz
          sid=$(curl -sf -X POST localhost:8000/v1/chat -H 'content-type: application/json' \
            -d '{"message":"My name is Margaret Chen. DOB is 1985-03-15, SSN last four is 4472."}' | jq -r .session_id)
          curl -sf -X POST localhost:8000/v1/chat -H 'content-type: application/json' \
            -d "{\"session_id\":\"$sid\",\"message\":\"What is the status of CL-2048?\"}" | tee /dev/stderr | jq -e '.verified'
          curl -sf localhost:8000/metrics | grep -q claimbot_turns_total
          docker logs cb | tail -5
